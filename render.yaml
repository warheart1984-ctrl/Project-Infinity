# Project Infinity (AAIS) — Render Blueprint
# Apply: Dashboard → New → Blueprint, or sync from this repo.
#
# Sovereign Assistant stack users care about:
#   aais-api (Docker web) + aais-frontend (static SPA; Docker image used by compose)
# Optional platform mesh (pilot): platform-api / platform-worker / platform-db / platform-redis
# Frontend Docker/self-host: frontend/docs/RENDER_DEPLOY.md (Option A)
# Blueprint uses Option B static — Vite bake-in; nginx PORT binding stays local/compose
#
# Gaps vs local docker compose:
# - Ephemeral disk: WITHOUT the aais-runtime disk below, OAuth tokens under
#   .runtime/oauth are wiped on every redeploy/restart — attach the disk or use
#   an external secret store
# - MinIO → external S3 (PLATFORM_S3_* sync:false)
# - Shared pilot_runtime volume → per-service disks (not shared across replicas)
# - Static FE cannot reverse-proxy /api — set VITE_API_BASE_URL=https://<aais-api> at build
# - WSS: browser must use wss:// to aais-api (or custom domain); Render terminates TLS

databases:
  - name: platform-db
    plan: basic-256mb
    region: oregon
    databaseName: platform
    user: platform

envVarGroups:
  - name: aais-provider-keys
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional provider keys. These expose the corresponding adapter in the
      # model picker only after the account owner supplies a key in Render.
      # A provider's trial/free quota is controlled by that provider; AAIS
      # never represents it as unlimited or guaranteed-free inference.
      - key: MISTRAL_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: AI21_API_KEY
        sync: false
      # NVIDIA NIM credentials are supplied in Render, never committed.
      - key: NVIDIA_API_KEY
        sync: false
      - key: AAIS_NVIDIA_MODEL
        value: meta/muse-glimmer-30b
      - key: AAIS_OPENAI_MODEL
        value: gpt-4o-mini
      - key: AAIS_CLAUDE_MODEL
        value: claude-3-5-haiku-latest

  - name: aais-oauth-middleware
    envVars:
      - key: AAIS_GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: AAIS_GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: AAIS_GMAIL_OAUTH_REDIRECT_URI
        sync: false
      - key: AAIS_MS_OAUTH_CLIENT_ID
        sync: false
      - key: AAIS_MS_OAUTH_CLIENT_SECRET
        sync: false
      - key: AAIS_MS_OAUTH_REDIRECT_URI
        sync: false
      - key: AAIS_MS_OAUTH_TENANT
        value: common
      - key: AAIS_GMAIL_ACCESS_TOKEN
        sync: false
      - key: AAIS_MS_GRAPH_TOKEN
        sync: false

services:
  # Internal platform API (was platform-api in compose)
  - type: pserv
    name: platform-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./deploy/platform/Dockerfile
    dockerContext: .
    dockerCommand: python -m platform serve --host 0.0.0.0 --port $PORT
    disk:
      name: platform-runtime
      mountPath: /app/.runtime
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8090"
      - key: PLATFORM_DATABASE_URL
        fromDatabase:
          name: platform-db
          property: connectionString
      - key: PLATFORM_REDIS_URL
        fromService:
          name: platform-redis
          type: keyvalue
          property: connectionString
      - key: PLATFORM_MASTER_API_KEY
        generateValue: true
      - key: PLATFORM_REQUIRE_API_KEY
        value: "1"
      - key: PLATFORM_WITNESS_REQUIRED
        value: "0"
      - key: PLATFORM_WITNESS_QUORUM
        value: "0"
      - key: PLATFORM_EXPORT_PACK_SECRET
        generateValue: true
      - key: PLATFORM_EXCHANGE_SECRET
        generateValue: true
      # External S3 is optional. Omit its credentials in the default Blueprint;
      # platform.settings falls back to local/runtime-backed artifact handling.
      # Empty source keys keep pre-existing Blueprint worker wiring resolvable
      # while Render reconciles the removed optional S3 settings.
      - key: PLATFORM_S3_ENDPOINT
        value: ""
      - key: PLATFORM_S3_BUCKET
        value: ""
      - key: PLATFORM_S3_ACCESS_KEY
        value: ""
      - key: PLATFORM_S3_SECRET_KEY
        value: ""

  - type: worker
    name: platform-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./deploy/platform/Dockerfile
    dockerContext: .
    dockerCommand: python -m platform worker
    envVars:
      - key: PLATFORM_WORKER_REGION
        value: us
      - key: PLATFORM_DATABASE_URL
        fromDatabase:
          name: platform-db
          property: connectionString
      - key: PLATFORM_REDIS_URL
        fromService:
          name: platform-redis
          type: keyvalue
          property: connectionString
      - key: PLATFORM_API_BASE_URL
        fromService:
          name: platform-api
          type: pserv
          property: hostport
      - key: PLATFORM_MASTER_API_KEY
        fromService:
          name: platform-api
          type: pserv
          envVarKey: PLATFORM_MASTER_API_KEY

  # Public AAIS API — Jarvis / task-bus / OAuth / middleware plugs
  # aais-middleware Node package is NOT a separate Render service (Python host owns HTTP).
  - type: web
    name: aais-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: aais-runtime
      mountPath: /app/.runtime
      sizeGB: 5
    envVars:
      - fromGroup: aais-provider-keys
      - fromGroup: aais-oauth-middleware
      - key: PORT
        value: "8000"
      - key: AAIS_RUNTIME_DIR
        value: /app/.runtime/aais-data
      - key: JARVIS_DATA_DIR
        value: /app/.runtime/aais-data
      - key: ENVIRONMENT
        value: production
      - key: AAIS_DEPLOYMENT_MODE
        value: full
      # Select the configured NVIDIA provider at process startup. The API key
      # itself comes only from the Render-managed aais-provider-keys group.
      - key: AAIS_MODEL_MODE
        value: real
      - key: AAIS_BOOTSTRAP_REAL_AT_STARTUP
        value: "1"
      - key: FORGE_BASE_URL
        fromService:
          name: aais-forge
          type: pserv
          property: hostport
      - key: FORGE_EVAL_BASE_URL
        fromService:
          name: aais-forge-eval
          type: pserv
          property: hostport
      - key: EVOLVE_BASE_URL
        fromService:
          name: aais-evolve
          type: pserv
          property: hostport
      - key: JARVIS_MEMORYBOARD_URL
        fromService:
          name: jarvis-memoryboard
          type: pserv
          property: hostport
      - key: PLATFORM_API_BASE_URL
        fromService:
          name: platform-api
          type: pserv
          property: hostport
      # Optional long-lived tokens (prefer OAuth store on disk)
      - key: GMAIL_ACCESS_TOKEN
        sync: false
      - key: MICROSOFT_GRAPH_TOKEN
        sync: false
      - key: APP_BEARER_TOKEN
        sync: false

  # Internal contractor services. They have no public URLs; only aais-api can
  # reach them through Render's private host:port addresses.
  - type: pserv
    name: aais-forge
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m flask --app forge.main run --host 0.0.0.0 --port $PORT
    disk:
      name: forge-runtime
      mountPath: /app/.runtime
      sizeGB: 1
    envVars:
      - key: FORGE_STORAGE
        value: /app/.runtime/forge

  - type: pserv
    name: aais-forge-eval
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m flask --app forge_eval.main run --host 0.0.0.0 --port $PORT
    disk:
      name: forge-eval-runtime
      mountPath: /app/.runtime
      sizeGB: 1
    envVars:
      - key: FORGE_EVAL_STORAGE
        value: /app/.runtime/forge_eval

  - type: pserv
    name: aais-evolve
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m flask --app evolve_engine.main run --host 0.0.0.0 --port $PORT
    disk:
      name: evolve-runtime
      mountPath: /app/.runtime
      sizeGB: 1
    envVars:
      - key: EVOLVE_STORAGE
        value: /app/.runtime/evolve
      - key: FORGE_EVAL_BASE_URL
        fromService:
          name: aais-forge-eval
          type: pserv
          property: hostport

  # Continuity Ledger: AMUL LTM substrate + governed EMR/STM activation.
  # It is private on Render; agents access it through its REST API or the
  # dependency-light stdio MCP wrapper in services/jarvis-memoryboard/mcp.
  - type: pserv
    name: jarvis-memoryboard
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./services/jarvis-memoryboard/Dockerfile
    dockerContext: ./services/jarvis-memoryboard
    dockerCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: jarvis-memoryboard-data
      mountPath: /var/lib/jarvis-memoryboard
      sizeGB: 1
    envVars:
      - key: JARVIS_STORE_PATH
        value: /var/lib/jarvis-memoryboard/continuity-ledger.json
      - key: JARVIS_AMUL_PATH
        value: /var/lib/jarvis-memoryboard/amul-field.jsonl
      - key: JARVIS_AMUL_GC_PATH
        value: /var/lib/jarvis-memoryboard/amul-checkpoints.jsonl
      - key: JARVIS_EMR_DYNAMICS_PATH
        value: /var/lib/jarvis-memoryboard/emr-dynamics.json

  # Operator UI — static SPA (Render Option B). SPA rewrite covers /sovereign/*.
  # Docker FE (frontend/Dockerfile) is for compose/self-host — see frontend/docs/RENDER_DEPLOY.md.
  # Set VITE_API_BASE_URL=https://<aais-api>.onrender.com after first API deploy (build-time).
  - type: web
    name: aais-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_AAIS_WS_ENABLED
        value: "0"
      - key: VITE_AAIS_WS_PATH
        value: /ws/chat/{sessionId}
      - key: VITE_AAIS_WS_URL
        sync: false
      - key: VITE_APP_BASE
        value: /

  - type: keyvalue
    name: platform-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
