# Sovereign Assistant + task-bus — local stack (no invented DBs)
# Usage:
#   cp .env.example .env   # optional provider/OAuth keys
#   docker-compose up --build   # or: docker compose up --build
# UI:  http://localhost:3000/sovereign
# API: http://localhost:8000/health
#
# Optional: uncomment api.env_file after creating .env
# aais-middleware is a Node library/CLI wired by the Python host — not a separate service.
# Full platform pilot (Postgres/Redis/MinIO): deploy/pilot/docker-compose.yml

version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aais-api:local
    ports:
      - "8000:8000"
    # env_file: .env
    environment:
      PORT: "8000"
      AAIS_DEPLOYMENT_MODE: full
      AAIS_RUNTIME_DIR: /app/.runtime/aais-data
      JARVIS_DATA_DIR: /app/.runtime/aais-data
      ENVIRONMENT: docker
      FORGE_BASE_URL: http://forge:6060
      FORGE_EVAL_BASE_URL: http://forge-eval:6061
      EVOLVE_BASE_URL: http://evolve:6062
    volumes:
      - aais_runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      forge:
        condition: service_healthy
      forge-eval:
        condition: service_healthy
      evolve:
        condition: service_healthy

  forge:
    image: aais-api:local
    command: python -m flask --app forge.main run --host 0.0.0.0 --port 6060
    environment:
      FORGE_STORAGE: /app/.runtime/forge
    volumes:
      - aais_runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6060/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  forge-eval:
    image: aais-api:local
    command: python -m flask --app forge_eval.main run --host 0.0.0.0 --port 6061
    environment:
      FORGE_EVAL_STORAGE: /app/.runtime/forge_eval
    volumes:
      - aais_runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6061/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  evolve:
    image: aais-api:local
    command: python -m flask --app evolve_engine.main run --host 0.0.0.0 --port 6062
    environment:
      EVOLVE_STORAGE: /app/.runtime/evolve
      FORGE_EVAL_BASE_URL: http://forge-eval:6061
    volumes:
      - aais_runtime:/app/.runtime
    depends_on:
      forge-eval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6062/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Uses landed frontend/Dockerfile + nginx/default.conf.template (do not fork).
  # Frontend-only: docker-compose -f frontend/docker-compose.yml up --build
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty → same-origin; nginx proxies /api + /ws via API_UPSTREAM
        VITE_API_BASE_URL: ""
        VITE_AAIS_WS_ENABLED: "0"
        VITE_APP_BASE: /
    image: aais-frontend:local
    ports:
      - "3000:80"
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  aais_runtime:
